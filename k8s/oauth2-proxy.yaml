# oauth2-proxy signs people in with the team realm at auth.sustenaut.eu (Keycloak: a
# passkey or an emailed code), as the client sustenaut.eu registered for its team sites
# (the deploy walk's auth.sign-in-client puts its id and secret in the Secret
# convergence-oidc).
# It lets in only people with the role convergence, from the token's access claim
# (the team access page at auth.sustenaut.eu/realms/team/access is the one list).
# Open without sign-in: /healthz, and the callers' /requests (POST /requests and
# GET /requests/ID), which the engine lets in by their bearer token alone (callers.py)
# and where it reads no X-Forwarded-* header.
# What the engine needs of this proxy: on signed-in routes, X-Forwarded-Email and
# X-Forwarded-Groups (the role convergence, from the access claim), which the
# Fulfil, Approve and Decline buttons require; on /requests, the caller's own
# Authorization header passed through unchanged (no --pass-authorization-header or
# --skip-jwt-bearer-tokens, which would replace or consume it).
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.sustenaut.eu/realms/team
            - --code-challenge-method=S256
            - --scope=openid email profile
            - --http-address=0.0.0.0:4180
            - --upstream=http://engine:8080/
            - --redirect-url=https://convergence.sustenaut.eu/oauth2/callback
            - --reverse-proxy=true
            # Trust X-Forwarded-* only from the cluster's pods (k3s's cluster-cidr), where Traefik runs.
            - --trusted-proxy-ip=10.42.0.0/16
            - --email-domain=*
            - --oidc-groups-claim=access
            - --allowed-group=convergence
            - --cookie-refresh=4m
            - --cookie-name=_convergence
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --skip-provider-button=true
            - --skip-auth-route=GET=^/healthz$
            - --skip-auth-route=POST=^/requests$
            - --skip-auth-route=GET=^/requests/[0-9A-Za-z-]+$
            # A live run's remote executor (pubdeploy executor, in the run's Job): the run's own
            # bearer token, which the engine checks; it reads no X-Forwarded-* header there.
            - --skip-auth-route=GET=^/runs/[0-9A-Za-z-]+/executor$
            - --skip-auth-route=POST=^/runs/[0-9A-Za-z-]+/events$
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: convergence-oidc
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: convergence-oidc
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: convergence-page-secrets
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
